- title: Technical Skills
  type: nested_list
  contents:
    - title: Programming and Data
      items:
        - "R: tidyverse, ggplot2, quanteda, stm, modelsummary, broom, readxl, openxlsx, patchwork, scales."
        - "Python: pandas, numpy, matplotlib, plotnine, pdfplumber, pdf2image, pytesseract, PIL, pathlib, argparse, urllib."
        - "Data formats and outputs: CSV, Excel, RDS, PDF text extraction, OCR text, DOCX, PDF, HTML, and publication-ready figures."
    - title: Methods
      items:
        - Survey analysis, statistical modeling, multinomial logistic regression, ordered logit, binary logit, OLS, and AIC model comparison.
        - Text-as-data analysis, structural topic modeling, KWIC/concordance analysis, sentiment and emotion analysis, and automated qualitative coding.
        - Computer vision and color measurement workflows, including face-region measurement, CIE L*a*b* color analysis, and CIEDE2000 perceptual distance.
    - title: Research Engineering
      items:
        - End-to-end reproducible pipelines from raw PDFs and survey exports to cleaned datasets, model outputs, diagnostics, tables, and visualizations.
        - Archival corpus construction, mixed native-text/OCR processing, automated tagging and metadata workflows, and codebook generation.
